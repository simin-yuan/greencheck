[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greencheck"
version = "0.2.0"
description = "A number is not a measurement until it has been observed to take different values on inputs known to differ."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Simon" }]
keywords = ["observability", "metrics", "agent", "monitoring", "evaluation", "test"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
greencheck = "greencheck.cli:main"

[tool.setuptools.packages.find]
include = ["greencheck*"]
