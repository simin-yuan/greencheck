[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greencheck"
version = "0.3.0"
description = "Your validator passes inputs it should reject. greencheck finds them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Simon" }]
keywords = [
    "mutation-testing",
    "observability",
    "metrics",
    "agent",
    "monitoring",
    "evaluation",
    "verification",
    "test",
    "testing",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/simin-yuan/greencheck"
Repository = "https://github.com/simin-yuan/greencheck"
Issues = "https://github.com/simin-yuan/greencheck/issues"
Changelog = "https://github.com/simin-yuan/greencheck/releases"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
greencheck = "greencheck.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
greencheck = ["skills/*/SKILL.md", "skills/README.md"]

[tool.setuptools.packages.find]
include = ["greencheck*"]
